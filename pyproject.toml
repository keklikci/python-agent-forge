[project]
name = "python-agent-forge"
version = "0.1.0"
description = "Python repository automation for Codex agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
python-agent-forge = "python_agent_forge.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
