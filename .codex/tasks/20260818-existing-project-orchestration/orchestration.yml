task_id: orchestration
brief: "Execute validated Codex task graphs safely in isolated worktrees."
acceptance_criteria:
  - "Repository facts and orchestration policy load separately."
  - "Manifests reject unsafe paths, unknown dependencies, and cycles."
  - "Overlapping ownership is conservatively serialized."
  - "Ignored state supports portable status and saved-run resume."
  - "Planning is read-only and task worktrees are workspace-write only."
  - "Scope and validation failures use bounded same-thread repair."
owned_paths:
  - "src/python_agent_forge/**"
  - "tests/**"
  - "README.md"
  - "docs/agent-orchestration.md"
  - ".gitignore"
  - ".codex/tasks/20260818-existing-project-orchestration/orchestration.yml"
exclusions:
  - "GitHub provider, pushes, pull requests, checks, reviews, and stacked PRs"
  - "Automatic merge behavior"
dependencies:
  - adopt
branch: codex/autonomous-orchestration
validation_commands:
  - "uv sync"
  - "uv run ruff format --check ."
  - "uv run ruff check ."
  - "uv run pytest"
  - "sh tests/test_cli.sh"
  - "sh tests/test_init.sh"
pr:
  title: "feat(orchestration): execute Codex task graphs in worktrees"
  number: null
  base: codex/adopt-agent-forge
  status: planned
